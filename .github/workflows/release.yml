name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark this release as a preview
        required: true
        default: true
        type: boolean
      validation_only:
        description: Build and verify artifacts without creating a draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'An existing numeric version tag is required.'
          }
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = ./scripts/Get-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and test installer
        run: ./scripts/Build-Installer.ps1
      - name: Include matching source and release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $directory = "artifacts/releases/$env:RELEASE_VERSION"
          git archive --format=zip --prefix="Sessions-$env:RELEASE_VERSION/" --output="$directory/Sessions-$env:RELEASE_VERSION-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
          Copy-Item "docs/release-notes/$env:RELEASE_VERSION.md" "$directory/RELEASE-NOTES.md"
          # The MSI embeds WiX's native utility action. Supply its matching MS-RL source.
          $wixCommit = 'b8977d6f88e7b68e000bac226a2814f236770570'
          Invoke-WebRequest "https://codeload.github.com/wixtoolset/wix/zip/$wixCommit" -OutFile "$directory/WiX-7.0.0-source.zip"
          $files = Get-ChildItem $directory -File | Where-Object Extension -In '.msi', '.zip'
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content "$directory/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: artifacts/releases/${{ env.RELEASE_VERSION }}/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: ${{ inputs.validation_only && 'Validate release files' || 'Create draft release' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files
      - name: Verify transferred release files
        working-directory: release-files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS.txt
          test -s RELEASE-NOTES.md
      - name: Create draft release
        if: ${{ !inputs.validation_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--verify-tag --draft --title "Sessions $RELEASE_TAG" --notes-file release-files/RELEASE-NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          # An existing release is an error; never replace previously uploaded binaries.
          gh release create "$RELEASE_TAG" "${args[@]}" release-files/*.msi release-files/*.zip release-files/SHA256SUMS.txt
